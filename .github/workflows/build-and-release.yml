name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            goos: linux
            goarch: amd64
            artifact: livediff-linux-x64
          - name: Linux ARM64
            goos: linux
            goarch: arm64
            artifact: livediff-linux-arm64
          - name: macOS x64
            goos: darwin
            goarch: amd64
            artifact: livediff-macos-x64
          - name: macOS ARM64
            goos: darwin
            goarch: arm64
            artifact: livediff-macos-arm64
          - name: Windows x64
            goos: windows
            goarch: amd64
            artifact: livediff-windows-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile standalone executable
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p release
          go build -trimpath -ldflags="-s -w -buildid=" -o ./release/${{ matrix.artifact }} .

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: livediff-*
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum livediff-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
